name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    name: Security Hardening & Authorization CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK (Required for Firebase Firestore Emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies via lockfile
        run: bun install --frozen-lockfile

      - name: Install Firebase CLI globally
        run: npm install -g firebase-tools

      - name: Run Typecheck and Linter
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test

      - name: Run Firestore Rules Emulator Tests
        run: npm run test:rules

      - name: Run Production Build
        run: npm run build
