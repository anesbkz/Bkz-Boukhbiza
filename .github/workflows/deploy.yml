name: Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  pipeline:
    name: Validate and Deploy to Firebase
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT_MICRO_OPUS_SGHTT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MICRO_OPUS_SGHTT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK (Required for Firebase Firestore Emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies via lockfile
        run: bun install --frozen-lockfile

      - name: Install Functions dependencies
        run: npm --prefix functions ci

      - name: Install Firebase CLI globally
        run: npm install -g firebase-tools

      - name: Run Typecheck and Linter
        run: npm run lint

      - name: Run Functions Typecheck and Build
        run: npm --prefix functions run build

      - name: Run Unit Tests (Security, RBAC, Navigation)
        run: npm run test

      - name: Run Firestore Rules Emulator Tests
        run: npm run test:rules

      - name: Inject Build Commit Metadata
        run: |
          echo "VITE_BUILD_SHA=${{ github.sha }}" >> $GITHUB_ENV
          echo "VITE_BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV

      - name: Run Production Build
        run: npm run build
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_BUILD_TIME: ${{ env.VITE_BUILD_TIME }}

      - name: Validate Deployment Credentials
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_MICRO_OPUS_SGHTT" ]; then
            echo "::error::Required secret FIREBASE_SERVICE_ACCOUNT_MICRO_OPUS_SGHTT is missing or empty. Please configure this secret in repository Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Deploy Firestore Rules, Indexes, and Cloud Functions
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_MICRO_OPUS_SGHTT" > /tmp/firebase-sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          firebase deploy --only firestore,functions --project micro-opus-sghtt --force
          rm -f /tmp/firebase-sa.json

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ env.FIREBASE_SERVICE_ACCOUNT_MICRO_OPUS_SGHTT }}'
          channelId: live
          projectId: micro-opus-sghtt

      - name: Verify Live Deployment Target
        run: |
          echo "=========================================="
          echo "ZIRON PRODUCTION DEPLOYMENT SUMMARY"
          echo "Target Project: micro-opus-sghtt"
          echo "Deployed SHA:   ${{ github.sha }}"
          echo "Hosting URL:    https://micro-opus-sghtt.web.app"
          echo "=========================================="
